[Settings]

; How a fortify effect treats your current value when it is applied and when it expires.
;   0  Absolute. A fortify raises your maximum and never moves your current value either way.
;   1  Ratio. A fortify keeps your current value at the same fraction of your maximum.
;   2  Off. Vanilla behaviour, including dying when a fortify health effect expires.
;   3  Restore. A fortify fills the value to its new maximum. Losing one still never moves it. Convenience rather than balance: any fortify food or potion becomes a full heal.
Mode = 0

; 0 fixes every actor, 1 fixes only the player. NPCs hit the same bug.
PlayerOnly = 0
